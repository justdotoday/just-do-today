spring:
  application:
    name: just-do-today

  # DB 및 Flyway 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: just_do_today
    repair-on-migrate: true

  # OAuth2 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: '{baseUrl}/login/oauth2/code/google'
            scope:
              - openid
              - profile

          kakao:
            client-id: '${KAKAO_CLIENT_ID}'
            client-secret: '${KAKAO_CLIENT_SECRET}'
            redirect-uri: '{baseUrl}/login/oauth2/code/kakao'
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# MyBatis 설정 (dev 브랜치의 매퍼 위치 설정 통합)
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Swagger 설정
springdoc:
  packages-to-scan: com.example.just_do_today.controller
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8
  swagger-ui:
    path: /swagger
    disable-swagger-default-url: true
    display-request-duration: true
    operations-sorter: alpha

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.security: DEBUG # feat.googlelogin: 디버깅을 위해 유지

app:
  oauth-success-redirect: ${OAUTH_SUCCESS_REDIRECT}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174} # 디폴트 프론트 주소
  jwt:
    secret: ${JWT_SECRET}
    access-exp-min: 1440
